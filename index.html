<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOODLINE Kitchen – Seller orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--charcoal:#15191d;--charcoal-2:#1e2429;--steel:#2b3238;--steel-light:#4a545c;--amber:#e0342a;--yellow:#ffd93d;--gray:#8a9199;--soft:#c4cbd1;--white:#fff}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,sans-serif;background:var(--charcoal);color:var(--yellow);line-height:1.6;overflow-x:hidden}
button,input{font-family:inherit}button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 28px}
h1,h2,h3,h4,.logo{font-family:Oswald,sans-serif;font-weight:600;line-height:1.12;letter-spacing:.2px}
.tag{display:inline-flex;align-items:center;gap:10px;font:500 .85rem Oswald,sans-serif;color:var(--amber);margin-bottom:14px}
.tag:before{content:"";width:28px;height:3px;background:var(--amber)}
header{position:fixed;top:0;left:0;right:0;z-index:500;padding:20px 0;transition:padding .25s,background .25s,box-shadow .25s}
header.scrolled{padding:12px 0;background:var(--charcoal);box-shadow:0 6px 24px #0007}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font-weight:700;font-size:1.5rem}.logo span{color:var(--amber)}
.logo small{font:500 1rem Inter,sans-serif;color:var(--gray);margin-left:10px}
.hero{position:relative;padding:140px 0 80px;background:linear-gradient(115deg,rgba(21,25,29,.94),rgba(21,25,29,.6)),radial-gradient(ellipse at 78% 30%,#33404a,#1c2227 55%,#14181c)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 90px);pointer-events:none}
.hero .wrap{position:relative}
.hero h1{font-size:clamp(2.4rem,5vw,4rem);text-transform:uppercase;margin-bottom:18px;max-width:700px}
.hero h1 em{font-style:normal;color:var(--amber)}
.lead{color:var(--soft);max-width:520px;margin-bottom:30px}
section{scroll-margin-top:90px;padding:40px 0 20px;border-top:4px solid var(--amber);margin-bottom:24px}
section h2{font-size:2.1rem;text-transform:uppercase;margin-bottom:20px}
.marker{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.marker .idx{font:600 .85rem Oswald,sans-serif;color:var(--amber);letter-spacing:1px}
.marker .line{flex:1;height:1px;background:#ffffff29}
.marker .label{font:500 .75rem Oswald,sans-serif;color:var(--gray);text-transform:uppercase;letter-spacing:2.5px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #ffffff29}

.live{font-size:.85rem;color:var(--soft)}.live:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#3ddc97;margin-right:8px}
.hero{padding-bottom:90px}
.strip{position:relative;z-index:4;margin-top:-50px}
.strip .wrap{background:var(--charcoal-2);display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 22px 44px #0007;padding:0}
.stat{padding:28px 22px;text-align:center;border-right:1px solid #ffffff14}.stat:last-child{border:0}
.stat strong{display:block;font:600 2.4rem Oswald,sans-serif;color:var(--amber)}
.stat span{font-size:.82rem;color:#a7aeb4;text-transform:uppercase;letter-spacing:.6px}
main.wrap{padding:50px 28px 70px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.o{background:var(--charcoal-2);border:1px solid #ffffff1f;border-left:6px solid var(--amber);padding:18px}.o.READY{border-left-color:var(--yellow)}
.top{display:flex;justify-content:space-between;align-items:baseline}.top h4{font-size:1.3rem;text-transform:uppercase}.top span{color:var(--gray);font-size:.8rem}
.who{margin:6px 0 12px}.who b{display:block}.who span{color:var(--soft)}
.sum{display:flex;justify-content:space-between;padding:12px 0;font:600 1.15rem Oswald,sans-serif}.sum span:last-child{color:var(--amber)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--steel)}
.seg button{padding:11px;font:600 .9rem Oswald,sans-serif;letter-spacing:.5px;background:var(--steel);color:var(--soft)}
.seg button:not(.on):hover{background:var(--steel-light)}
.seg .on.pr{background:var(--amber);color:var(--charcoal)}.seg .on.rd{background:var(--yellow);color:var(--charcoal)}
.none{border:1px dashed var(--steel-light);padding:22px;color:var(--gray);grid-column:1/-1}
@media(max-width:700px){.strip .wrap{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid #ffffff14}}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo">FOOD<span>LINE</span><small>Kitchen</small></div><div class="live">Listening for orders</div></div></header>
<div class="hero"><div class="wrap"><div class="tag">Seller dashboard</div><h1>Incoming <em>orders</em></h1><p class="lead">New customer orders appear here automatically. Mark each one READY when it is packed and waiting for the rider.</p></div></div>
<div class="strip"><div class="wrap"><div class="stat"><strong id="n0">0</strong><span>Total orders</span></div><div class="stat"><strong id="n1">0</strong><span>Preparing</span></div><div class="stat"><strong id="n2">0</strong><span>Ready for rider</span></div></div></div>
<main class="wrap"><section><div class="marker"><span class="idx">01</span><span class="line"></span><span class="label">In the kitchen</span></div><h2>Preparing</h2><div class="list" id="lp"></div></section>
<section><div class="marker"><span class="idx">02</span><span class="line"></span><span class="label">Forwarded to rider</span></div><h2>Ready for rider</h2><div class="list" id="lr"></div></section></main>
<script>
const KEY="foodline_orders",$=s=>document.querySelector(s),peso=n=>"₱"+n.toLocaleString();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(_){return[]}};
function card(o){const t=new Date(o.at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
return `<article class="o ${o.status}"><div class="top"><h4>Order ${esc(o.id)}</h4><span>${t}</span></div>
<div class="who"><b>${esc(o.name)}</b><span>${esc(o.loc)}</span></div>
${o.items.map(i=>`<div class="row"><span>${i.e} ${esc(i.n)} × ${i.q}</span><span>${peso(i.p*i.q)}</span></div>`).join("")}
<div class="sum"><span>Total</span><span>${peso(o.total)}</span></div>
<div class="seg" role="group" aria-label="Order status"><button class="pr ${o.status=="PREPARING"?"on":""}" data-id="${esc(o.id)}" data-s="PREPARING">PREPARING</button><button class="rd ${o.status=="READY"?"on":""}" data-id="${esc(o.id)}" data-s="READY">READY</button></div></article>`}
function paint(){const all=load().sort((a,b)=>b.at-a.at),p=all.filter(o=>o.status!="READY"),r=all.filter(o=>o.status=="READY");
$("#n0").textContent=all.length;$("#n1").textContent=p.length;$("#n2").textContent=r.length;
$("#lp").innerHTML=p.length?p.map(card).join(""):'<div class="none">No orders being prepared. New customer orders appear here automatically.</div>';
$("#lr").innerHTML=r.length?r.map(card).join(""):'<div class="none">Orders you mark READY move here and are forwarded to the rider site.</div>'}
document.addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(!b)return;
const all=load(),o=all.find(x=>x.id===b.dataset.id);if(!o||o.status===b.dataset.s)return;
o.status=b.dataset.s;if(o.status=="READY")o.readyAt=Date.now();else delete o.readyAt;
try{localStorage.setItem(KEY,JSON.stringify(all));new BroadcastChannel(KEY).postMessage("upd")}catch(_){}paint()});
addEventListener("storage",e=>{if(e.key===KEY)paint()});
try{new BroadcastChannel(KEY).onmessage=paint}catch(_){}
addEventListener("scroll",()=>document.querySelector("header").classList.toggle("scrolled",scrollY>40),{passive:true});
setInterval(paint,5000);paint();
</script>
</body>
</html>
